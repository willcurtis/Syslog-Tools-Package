[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syslogtools"
version = "0.1.0"
description = "Syslog sender (pro) and TUI collector"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name="Your Name"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Logging",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
syslog-pro = "syslogtools.pro:main"
syslog-tui = "syslogtools.tui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
